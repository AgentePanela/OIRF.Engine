- type: style
  id: EngineDefault
  parent: [EngineDefaultButtons, EngineDefaultScroll, EngineDefaultLineEdit, EngineDefaultCheckBox, EngineDefaultProgressBar]

- type: style
  id: EngineDefaultButtons
  abstract: true
  rules:
    - class: { styleClass: button }
      properties:
        background: "#1a1a1a"
        outlineColor: "#770B0B"
        outlineThickness: 2
        padding: 10

    - class: { styleClass: button, pseudoClass: hover }
      properties:
        background: "#262626"
        outlineColor: "#891E1E"

    - class: { styleClass: button, pseudoClass: pressed }
      properties:
        background: "#260202"
        outlineColor: "#591919"

    - class: { styleClass: button, pseudoClass: disabled }
      properties:
        background: "#0A0A0A"
        outlineColor: "#4a1414"

- type: style
  id: EngineDefaultScroll
  abstract: true
  rules:
    - class: { styleClass: scrollBar }
      properties:
        background: "#141414"
        thumbColor: "#4a4a4a"
        thumbCorner: 10
        antiAnalising: 1

    - class: { styleClass: scrollBar, pseudoClass: hover }
      properties:
        thumbColor: "#5a5a5a"

    - class: { styleClass: scrollBar, pseudoClass: pressed }
      properties:
        thumbColor: "#636363"

- type: style
  id: EngineDefaultLineEdit
  abstract: true
  rules:
    - class: { styleClass: lineEdit }
      properties:
        background: "#1a1a1a"
        outlineColor: "#770B0B"
        outlineThickness: 1
        padding: 6
        color: "#FFFFFF"
        placeholderColor: "#757575"
        selectionColor: "#3390FF80"
        caretColor: "#FFFFFF"

    - class: { styleClass: lineEdit, pseudoClass: focus }
      properties:
        outlineColor: "#B02929"

- type: style
  id: EngineDefaultCheckBox
  abstract: true
  rules:
    - class: { styleClass: checkBox }
      properties:
        padding: 0
        tint: "#FFFFFF"

    - class: { styleClass: checkBox, pseudoClass: hover }
      properties:
        tint: "#DDDDDD"

    - class: { styleClass: checkBox, pseudoClass: disabled }
      properties:
        tint: "#80FFFFFF"

- type: style
  id: EngineDefaultProgressBar
  abstract: true
  rules:
    - class: { styleClass: progressBar }
      properties:
        background: "#1a1a1a"
        fillColor: "#4a1414"
        outlineColor: "#4a1414"
        outlineMargin: -5
        outlineThickness: 3
