- type: style
  id: EngineDefault
  parent: [EngineDefaultButtons, EngineDefaultScroll, EngineDefaultLineEdit,
    EngineDefaultCheckBox, EngineDefaultProgressBar, EngineDefaultSlider, EngineDefaultTextEdit,
    EngineDefaultWindow, EngineDefaultTabContainer, EngineDefaultSplitContainer, EngineDefaultItemList, EngineDefaultOptionButton]
  rules:
    - class: { control: label }
      properties:
        color: "#1A1A1A"

- type: style
  id: EngineDefaultButtons
  abstract: true
  rules:
    - class: { control: button }
      properties:
        background: { colorA: "#F5F5F5", colorB: "#DDDDDD", pointA: [0, 0], pointB: [0, 1] }
        outlineColor: "#C4C4C4"
        outlineThickness: 1
        padding: 10

    - class: { control: button, pseudoClass: hover }
      properties:
        background: { colorA: "#EFEFEF", colorB: "#CFCFCF", pointA: [0, 0], pointB: [0, 1] }
        outlineColor: "#B0B0B0"

    - class: { control: button, pseudoClass: pressed }
      properties:
        background: { colorA: "#BEBEBE", colorB: "#D4D4D4", pointA: [0, 0], pointB: [0, 1] }
        outlineColor: "#9E9E9E"

    - class: { control: button, pseudoClass: disabled }
      properties:
        background: "#F0F0F0"
        outlineColor: "#E0E0E0"

- type: style
  id: EngineDefaultScroll
  abstract: true
  rules:
    - class: { control: scrollBar }
      properties:
        background: { colorA: "#EFEFEF", colorB: "#E0E0E0", pointA: [0, 0], pointB: [0, 1] }
        thumbColor: "#C4C4C4"
        thumbCorner: 10
        antiAnalising: 1

    - class: { control: scrollBar, pseudoClass: hover }
      properties:
        thumbColor: "#B0B0B0"

    - class: { control: scrollBar, pseudoClass: pressed }
      properties:
        thumbColor: "#909090"

- type: style
  id: EngineDefaultLineEdit
  abstract: true
  rules:
    - class: { control: lineEdit }
      properties:
        background: "#FFFFFF"
        outlineColor: "#C4C4C4"
        outlineThickness: 1
        padding: 6
        color: "#1A1A1A"
        placeholderColor: "#9E9E9E"
        selectionColor: "#2196F340"
        caretColor: "#1A1A1A"

    - class: { control: lineEdit, pseudoClass: focus }
      properties:
        outlineColor: "#2196F3"

    - class: { control: lineEdit, pseudoClass: readonly }
      properties:
        background: "#F0F0F0"
        outlineColor: "#DDDDDD"
        color: "#9E9E9E"

- type: style
  id: EngineDefaultTextEdit
  abstract: true
  rules:
    - class: { control: textEdit }
      properties:
        background: "#FFFFFF"
        outlineColor: "#C4C4C4"
        outlineThickness: 1
        padding: 6
        color: "#1A1A1A"
        placeholderColor: "#9E9E9E"
        selectionColor: "#2196F340"
        caretColor: "#1A1A1A"

    - class: { control: textEdit, pseudoClass: focus }
      properties:
        outlineColor: "#2196F3"

    - class: { control: textEdit, pseudoClass: readonly }
      properties:
        background: "#F0F0F0"
        outlineColor: "#DDDDDD"
        color: "#9E9E9E"

- type: style
  id: EngineDefaultCheckBox
  abstract: true
  rules:
    - class: { control: checkBox }
      properties:
        padding: 0
        tint: "#FFFFFF"

    - class: { control: checkBox, pseudoClass: hover }
      properties:
        tint: "#DDDDDD"

    - class: { control: checkBox, pseudoClass: disabled }
      properties:
        tint: "#80FFFFFF"

- type: style
  id: EngineDefaultProgressBar
  abstract: true
  rules:
    - class: { control: progressBar }
      properties:
        background: { colorA: "#EFEFEF", colorB: "#E4E4E4", pointA: [0, 0], pointB: [0, 1] }
        fillColor: "#2196F3"
        outlineColor: "#C4C4C4"
        outlineMargin: 0
        outlineThickness: 1

- type: style
  id: EngineDefaultSlider
  abstract: true
  rules:
    - class: { control: slider }
      properties:
        trackColor: "#D0D0D0"
        grabberColor: "#2196F3"
        grabberCorner: 8

    - class: { control: slider, pseudoClass: hover }
      properties:
        grabberColor: "#42A5F5"

    - class: { control: slider, pseudoClass: pressed }
      properties:
        grabberColor: "#1976D2"

- type: style
  id: EngineDefaultWindow
  abstract: true
  rules:
    - class: { control: windowRoot }
      properties:
        zIndex: 999
    - class: { control: window }
      properties:
        separation: 0

    - class: { control: windowTitleRow }
      properties:
        separation: 0

    - class: { control: windowTitleBar }
      properties:
        background: { colorA: "#EAEAEA", colorB: "#D6D6D6", pointA: [0, 0], pointB: [0, 1] }
        outlineColor: "#C4C4C4"
        outlineThickness: 1
        padding: 6

    - class: { control: windowTitle }
      properties:
        color: "#1A1A1A"

    - class: { control: windowCloseButton }
      properties:
        background: { colorA: "#EAEAEA", colorB: "#D6D6D6", pointA: [0, 0], pointB: [0, 1] }
        outlineColor: "#C4C4C4"
        outlineThickness: 1
        padding: 6

    - class: { control: windowCloseButton, pseudoClass: hover }
      properties:
        background: "#F44336"

    - class: { control: windowContents }
      properties:
        background: "#FFFFFF"
        outlineColor: "#C4C4C4"
        outlineThickness: [1, 0, 1, 1]
        padding: 10

- type: style
  id: EngineDefaultTabContainer
  abstract: true
  rules:
    - class: { control: tabBar }
      properties:
        background: { colorA: "#E6E6E6", colorB: "#D6D6D6", pointA: [0, 0], pointB: [0, 1] }

    - class: { control: tabButton, pseudoClass: active }
      properties:
        background: "#FFFFFF"
        outlineColor: "#2196F3"

    - class: { control: tabPages }
      properties:
        background: "#FFFFFF"
        outlineColor: "#C4C4C4"
        outlineThickness: [1, 0, 1, 1]
        padding: 10

- type: style
  id: EngineDefaultSplitContainer
  abstract: true
  rules:
    - class: { control: splitHandle }
      properties:
        background: { colorA: "#D8D8D8", colorB: "#C4C4C4", pointA: [0, 0], pointB: [0, 1] }

    - class: { control: splitHandle, pseudoClass: hover }
      properties:
        background: "#B0B0B0"

- type: style
  id: EngineDefaultItemList
  abstract: true
  rules:
    - class: { control: itemList }
      properties:
        background: "#FFFFFF"
        outlineColor: "#C4C4C4"
        outlineThickness: 1

- type: style
  id: EngineDefaultOptionButton
  abstract: true
  rules:
    - class: { control: optionButtonPopup }
      properties:
        background: "#FFFFFF"
        outlineColor: "#C4C4C4"
        outlineThickness: 1
        zIndex: 1000
